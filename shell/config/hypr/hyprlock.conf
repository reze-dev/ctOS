# ==============================================================================
# ctOS v2.0 // SYSTEM LOCKSCREEN CONFIGURATION
# Hyprlock themed strictly to the ctOS visual language
#
# Tokens:
#   Acid Green Accent:    #1BFD9C -> rgba(27, 253, 156, 1.0)
#   Warning/Error Red:    #FC3E38 -> rgba(252, 62, 56, 1.0)
#   Void / Base Surface:  #0E0E0E -> rgba(14, 14, 14, 1.0)
#   Border Secondary:     #7A7A7A -> rgba(122, 122, 122, 1.0)
#   Border Light:         #D9D9D9 -> rgba(217, 217, 217, 1.0)
#   Text Primary:         #FFFFFF -> rgba(255, 255, 255, 1.0)
#   Font Family:          Maple Mono, monospace
# ==============================================================================

$font = Maple Mono, monospace

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    color = rgba(14, 14, 14, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# STATUS BANNER: SYSTEM LOCKED
label {
    monitor =
    text = ctOS v2.0 // SYSTEM LOCKED
    color = rgb(122, 122, 122)
    font_size = 13
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# DIGITAL CLOCK (%H:%M:%S)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(255, 255, 255)
    font_size = 72
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# DATE (%Y.%m.%d // %A)
label {
    monitor =
    text = cmd[update:10000] date +"%Y.%m.%d // %A"
    color = rgb(27, 253, 156)
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# MINIMALIST TERMINAL INPUT FIELD
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    inner_color = rgba(14, 14, 14, 0.85)
    outer_color = rgba(217, 217, 217, 0.4)
    check_color = rgb(27, 253, 156)
    fail_color = rgb(252, 62, 56)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 2

    font_family = $font
    placeholder_text = <span foreground="##7a7a7a">AUTHENTICATE // ENTER KEY</span>
    fail_text = <span foreground="##fc3e38">ACCESS DENIED ($ATTEMPTS)</span>
    fail_transition = 200

    position = 0, -60
    halign = center
    valign = center
}

# SECURE ENCLAVE FOOTER
label {
    monitor =
    text = [NODE // SECURE ENCLAVE ACTIVE]
    color = rgb(27, 253, 156)
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
