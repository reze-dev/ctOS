# ==============================================================================
# ctOS v2.0 // IDLE DAEMON CONFIGURATION
# Hypridle configured for ctOS lockscreen integration (Hyprland & Niri)
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on || niri msg action power-on-monitors || true
    ignore_dbus_inhibit = false
}

# Idle lock after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Display power off after 5.5 minutes (330 seconds)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off || niri msg action power-off-monitors || true
    on-resume = hyprctl dispatch dpms on || niri msg action power-on-monitors || true
}

# System suspend after 30 minutes (1800 seconds)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
