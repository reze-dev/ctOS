[package]
name = "northstar-installer"
version = "2.1.0"
edition = "2021"
description = "TUI-based NixOS installer for the Northstar configuration"
authors = ["reze-dev"]
repository = "https://github.com/reze-dev/northstar"
license = "MIT"

[[bin]]
name = "northstar-installer"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["user"] }
anyhow = "1"
zeroize = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
